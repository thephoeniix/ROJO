<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Método de Pago — Grapas Automotrices Rojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#df1717;--white:#fff;--muted:#c4c9d0;--sans:'Manrope',sans-serif;--disp:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--white);font-family:var(--sans);background:linear-gradient(180deg,#02070c66,#02070cf2),url('bg-foto.png') center/cover fixed}.page{width:min(100%,820px);min-height:min(900px,calc(100vh - 40px));display:flex;flex-direction:column;align-items:center;padding:42px 28px 28px;text-align:center;background:#0004;border:1px solid #ffffff29;box-shadow:0 24px 80px #00000070}.logo{width:min(88%,620px);height:auto;margin:0 auto 30px;display:block}.rule{width:min(100%,620px);height:3px;margin-bottom:30px;background:linear-gradient(90deg,transparent,var(--red) 20%,var(--red) 80%,transparent)}h1{margin:0 0 28px;font:700 clamp(30px,6vw,62px)/1 var(--disp);letter-spacing:.04em}.payment{width:min(100%,600px);padding:26px 22px 28px;background:#03080dd1;border:1px solid #ffffff24;border-top:3px solid var(--red)}.label{margin:0 0 8px;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.account{margin:0;font:600 clamp(20px,4vw,34px)/1.3 var(--disp);letter-spacing:.07em;overflow-wrap:anywhere}.bank{margin:10px 0 0;font-size:21px;font-weight:800}.holder{margin:4px 0 0;color:#ff4a40;font-size:21px;font-weight:800}.contact{margin-top:28px;padding-top:22px;border-top:1px solid #ffffff29}.contact-name{margin:0;font:700 clamp(25px,5vw,42px)/1 var(--disp)}.contact-role{margin:8px 0 0;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.contact-city{margin:5px 0 0;color:var(--muted);font-size:13px}.contact-data{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:18px}.contact-data a{color:#fff;font-size:15px;text-decoration:none}.copy{margin-top:22px;border:0;border-radius:999px;padding:11px 20px;color:#fff;background:linear-gradient(135deg,#ff3d32,var(--red));font:700 13px var(--sans);cursor:pointer}.back{margin-top:auto;padding-top:28px;color:var(--muted);font-size:13px;text-decoration:none}@media(max-width:520px){body{padding:0}.page{min-height:100vh;padding:28px 15px 22px;border:0}.logo{width:100%;margin-bottom:24px}.contact-data{flex-direction:column;gap:7px}}
</style>
</head>
<body><main class="page"><img class="logo" src="Logos/logo_primary_texto_blanco.png" alt="Grapas Automotrices Rojo"><div class="rule"></div><h1>MÉTODO DE PAGO</h1><section class="payment"><p class="label">Cuenta Clave</p><p class="account">0026 8070 1871 5276 17</p><p class="bank">BANAMEX</p><p class="holder">ANALI MURILLO LAGUNAS</p><div class="contact"><p class="contact-name">ANALI MURILLO</p><p class="contact-role">Asesora de ventas</p><p class="contact-city">Querétaro, MX.</p><div class="contact-data"><a href="mailto:analimuriilo12@gmail.com">analimuriilo12@gmail.com</a><a href="tel:+524428469502">442 846 9502</a></div></div><button class="copy" type="button" id="copy">Copiar cuenta clave</button></section><a class="back" href="index.html">Volver al inicio</a></main><script>document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText('0026 8070 1871 5276 17');document.getElementById('copy').textContent='Cuenta copiada'}catch(e){}};</script></body>
</html>
